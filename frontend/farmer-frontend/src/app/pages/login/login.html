<!-- ENTIRE FILE IS NEW -->

<!-- Main container - green background, centered -->
<div class="min-h-screen bg-green-50 flex items-center justify-center p-4">

  <!-- White card -->
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <!-- Logo and title section -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🌾</div>
      <h1 class="text-3xl font-bold text-green-700">FarmPrice</h1>
      <p class="text-gray-500 mt-1">Login to your account</p>
    </div>

    <!-- Error message - only shows when errorMessage is not empty -->
    @if (errorMessage) {
      <div class="bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
        {{ errorMessage }}
      </div>
    }

    <!-- Login form -->
    <form (ngSubmit)="onLogin()">

      <!-- Email input -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- Password input -->
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- Submit button - disabled when loading -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition disabled:opacity-50">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <!-- Link to register page -->
    <p class="text-center text-gray-500 mt-6">
      Don't have an account?
      <a routerLink="/register" class="text-green-600 font-semibold hover:underline">
        Register here
      </a>
    </p>

  </div>
</div>
