<!-- ENTIRE FILE IS NEW -->
<div class="min-h-screen bg-green-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-lg">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🌾</div>
      <h1 class="text-3xl font-bold text-green-700">FarmPrice</h1>
      <p class="text-gray-500 mt-1">Create your farmer account</p>
    </div>

    <!-- Error Message -->
    @if (errorMessage) {
      <div class="bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
        {{ errorMessage }}
      </div>
    }

    <!-- Register Form -->
    <form (ngSubmit)="onRegister()">

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          Full Name
        </label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Enter your full name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          Email Address
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          Password
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Minimum 6 characters"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          Phone Number
        </label>
        <input
          type="tel"
          [(ngModel)]="phone"
          name="phone"
          placeholder="Enter your phone number"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
        />
      </div>

      <!-- District -->
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">
          Your District
        </label>
        <select
          [(ngModel)]="district"
          name="district"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500">
          <option value="">Select your district</option>
          @for (d of districts; track d) {
            <option [value]="d">{{ d }}</option>
          }
        </select>
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition disabled:opacity-50">
        {{ isLoading ? 'Creating account...' : 'Create Account' }}
      </button>

    </form>

    <!-- Login Link -->
    <p class="text-center text-gray-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-green-600 font-semibold hover:underline">
        Login here
      </a>
    </p>

  </div>
</div>
